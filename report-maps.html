<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>보고서용 지도</title>
<style>html,body{margin:0;background:#fff;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#map{width:780px;height:644px}
.lb{font-size:13px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3);border:1.5px solid #fff}
.apt{background:#173F35;color:#fff}.sch{background:#2A5D78;color:#fff}.pl{background:#fff;color:#2A5D78;border:1.5px dashed #2A5D78}
.sta{background:#8E44AD;color:#fff}.big{background:#AF8C45;color:#fff}.area{background:rgba(255,255,255,.88);color:#173F35;font-size:14px;border:1.5px solid #173F35}
.star{background:#C0392B;color:#fff;font-weight:800;font-size:14px;padding:3px 9px;border-radius:5px;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4);white-space:nowrap}
.rl{color:#8a6a28;font-weight:800;font-size:14px;background:rgba(255,255,255,.9);border-radius:4px;padding:0 5px}
</style></head><body><div id="map"></div>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8296dfe26fce4e6b650a19d608abb913&autoload=false"></script>
<script>
{const L={"트리니엔시티": [36.100735, 129.332146, "apt", 1609], "리슈빌": [36.098518, 129.331442, "apt", 646], "지엔하임": [36.097079, 129.336401, "apt", 558], "화산샬레": [36.099897, 129.328641, "apt", 553], "힐스테이트초곡": [36.095417, 129.335935, "apt", 1866], "호반써밋": [36.09771, 129.328293, "apt", 824], "초곡초": [36.098027, 129.332405, "school", null], "초서초": [36.096466, 129.332297, "school", null], "초곡중(2029 예정)": [36.096905, 129.329851, "plan_s", null], "흥해중": [36.093902, 129.334148, "school", null], "선린대": [36.093529, 129.331106, "school", null], "흥해읍행정복지센터": [36.109895, 129.339684, "big", null], "KTX포항역": [36.074365, 129.339907, "sta", null], "포항역삼구트리니엔": [36.077203, 129.332488, "apt2", null], "삼도뷰엔빌": [36.083312, 129.331087, "apt2", null]};
const T=[36.100356,129.333995];const m=(new URLSearchParams(location.search).get('m')||'1');
kakao.maps.load(()=>{const LL=(a,b)=>new kakao.maps.LatLng(a,b);
const map=new kakao.maps.Map(document.getElementById('map'),{center:LL(T[0],T[1]),level:5,draggable:false,scrollwheel:false,disableDoubleClickZoom:true});
const rings=m==='1'?[500,1000]:[1000,2000,3000];const R=rings[rings.length-1]*1.06;
const dlat=R/111000,dlng=R/(111000*Math.cos(T[0]*Math.PI/180));
const b=new kakao.maps.LatLngBounds(LL(T[0]-dlat,T[1]-dlng),LL(T[0]+dlat,T[1]+dlng));map.setBounds(b,0,0,0,0);
rings.forEach((r,i)=>{new kakao.maps.Circle({map,center:LL(T[0],T[1]),radius:r,strokeWeight:2.5,strokeColor:'#AF8C45',strokeOpacity:1,strokeStyle:'dash',fillColor:'#AF8C45',fillOpacity:i===0?.08:0});
 const el=document.createElement('span');el.className='rl';el.textContent=r>=1000?(r/1000)+'km':r+'m';
 new kakao.maps.CustomOverlay({map,position:LL(T[0]-r/111000*0.71,T[1]+r/(111000*Math.cos(T[0]*Math.PI/180))*0.71),content:el,yAnchor:.5});});
const add=(lat,lng,cls,txt,xa=.5,ya=1.2)=>{const el=document.createElement('div');el.className='lb '+cls;el.textContent=txt;new kakao.maps.CustomOverlay({map,position:LL(lat,lng),content:el,xAnchor:xa,yAnchor:ya,zIndex:3})};
const dot=(lat,lng,col)=>{const el=document.createElement('div');el.style.cssText='width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);background:'+col;new kakao.maps.CustomOverlay({map,position:LL(lat,lng),content:el,xAnchor:.5,yAnchor:.5,zIndex:2})};
const fmt=n=>n.toLocaleString('ko-KR');
if(m==='1'){
 const pos={'트리니엔시티':[.5,1.6],'리슈빌':[1.1,.5],'지엔하임':[-.1,.5],'화산샬레':[1.1,.5],'힐스테이트초곡':[-.1,.5],'호반써밋':[1.1,.5],'초곡초':[-.15,.9],'초서초':[-.15,.5],'초곡중(2029 예정)':[1.1,-.2],'흥해중':[-.12,.5],'선린대':[1.1,.5]};
 Object.entries(pos).forEach(([k,[xa,ya]])=>{const [lat,lng,kind,n]=L[k];
  const cls=kind==='apt'?'apt':kind==='school'?'sch':'pl';dot(lat,lng,kind==='apt'?'#173F35':'#2A5D78');
  add(lat,lng,cls,kind==='apt'?k.replace('힐스테이트초곡','힐스테이트')+' '+fmt(n)+'세대':k,xa,ya)});
}else{
 ['트리니엔시티','리슈빌','지엔하임','화산샬레','힐스테이트초곡','호반써밋'].forEach(k=>dot(L[k][0],L[k][1],'#173F35'));
 add(36.1035,129.3255,'area','초곡지구 (6개 단지 6,056세대)',.5,.5);
 dot(L['흥해읍행정복지센터'][0],L['흥해읍행정복지센터'][1],'#AF8C45');add(L['흥해읍행정복지센터'][0],L['흥해읍행정복지센터'][1],'big','흥해 구도심 · 행정복지센터',.5,1.3);
 dot(L['KTX포항역'][0],L['KTX포항역'][1],'#8E44AD');add(L['KTX포항역'][0],L['KTX포항역'][1],'sta','KTX 포항역',-.08,.5);
 dot(L['포항역삼구트리니엔'][0],L['포항역삼구트리니엔'][1],'#173F35');add(L['포항역삼구트리니엔'][0],L['포항역삼구트리니엔'][1],'area','이인지구',1.1,.5);
 dot(L['삼도뷰엔빌'][0],L['삼도뷰엔빌'][1],'#173F35');add(L['삼도뷰엔빌'][0],L['삼도뷰엔빌'][1],'area','학천리 단지',1.1,.5);
}
const st=document.createElement('div');st.className='star';st.textContent='★ 목적물';
new kakao.maps.CustomOverlay({map,position:LL(T[0],T[1]),content:st,xAnchor:.5,yAnchor:.5,zIndex:9});
document.title='ready';});}
</script></body></html>
